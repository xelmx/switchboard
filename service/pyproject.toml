[project]
name = "switchboard"
version = "0.1.0"
description = "Parakeet-TDT speech-to-text as an HTTP service with health, readiness and Prometheus metrics."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10",
  "torch>=2.6",
  "transformers>=5.16",
]

[project.scripts]
switchboard = "switchboard.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
