# `helm test switchboard` runs this pod and passes if it exits 0.
# A chart that installs is not the same as a service that answers; this is the
# difference, and it ships with the chart instead of living in a shell script.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "switchboard.fullname" . }}-test
  labels:
    {{- include "switchboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Remove a previous attempt before running, and a successful one after,
    # so a failed test's logs are still there to read.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      # Explicit, so GKE Autopilot does not have to invent them (it warns when it does).
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { cpu: 250m, memory: 512Mi }
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          HOST={{ include "switchboard.fullname" . }}:{{ .Values.service.port }}
          echo "--- healthz (is the process alive?)"
          curl -sf "http://$HOST/healthz"; echo
          echo "--- readyz (are the weights loaded?)"
          curl -sf "http://$HOST/readyz"; echo
          echo "--- metrics (is task 1's instrumentation wired?)"
          curl -sf "http://$HOST/metrics" | grep -q switchboard
          echo "OK"
