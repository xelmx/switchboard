# Every switch the same chart needs to run on a laptop, on GKE, and on a GPU
# node. Defaults here are the laptop: CPU, fp32, two copies, image built locally.

replicaCount: 2

image:
  repository: switchboard
  tag: dev
  # IfNotPresent: built locally, there is nothing to pull. On GKE this becomes
  # an Artifact Registry path and the policy stops mattering (task 5).
  pullPolicy: IfNotPresent

# The knobs the image reads as environment variables
# (service/switchboard/config.py). Same image everywhere; only these change.
model:
  id: ""        # "" -> the image default: the weights baked in at task 2
  device: cpu   # auto | cpu | cuda   — Docker Desktop's cluster has no GPU
  dtype: fp32   # auto | fp32 | fp16 | bf16
  # FAKE_MODEL=1 -> the service answers without loading any weights. Lets the
  # cluster mechanics (rollout, rollback, scheduling) be proven on a host with
  # no spare memory. Never true for a real measurement.
  fake: false
  # With fake: seconds of pretend inference per second of audio. 0.185 is what
  # the real model measured on this laptop's CPU (task 6) - so a fake pod queues
  # and scales like a real one, in ~150 MB instead of ~3 GB.
  fakeRtf: 0

# Anything else to put in the container's environment, as name/value pairs.
extraEnv: []

service:
  # LoadBalancer: Docker Desktop maps it to localhost; GKE gives it a real
  # external address. ClusterIP once something else fronts it.
  type: LoadBalancer
  port: 8000

# requests is what the scheduler reserves; limits is where the pod gets killed.
# 2.5 GB of fp32 weights + torch needs ~3 GB. With model.fake=true, cut these.
resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 4Gi

# startup  — how long the model may take to load before liveness starts judging
#            (periodSeconds x failureThreshold = the budget; 2 x 60 = 120 s)
# readiness— fail it and the Service stops sending this pod traffic. No restart.
# liveness — fail it and the container is restarted.
probes:
  startup:
    periodSeconds: 2
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    failureThreshold: 2
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# maxUnavailable: 0 is what makes a zero-failure rolling update possible —
# a new pod must be ready before any old one is taken down.
rollout:
  maxSurge: 1
  maxUnavailable: 0

terminationGracePeriodSeconds: 30
# Keep answering for a moment on shutdown while the Service forgets this pod.
preStopSleepSeconds: 3

podAnnotations: {}   # task 6 puts the Prometheus scrape hints here
nodeSelector: {}     # task 9 puts the GPU node selector here
tolerations: []
affinity: {}


# Task 6. Everything here needs the Prometheus Operator's CRDs
# (ServiceMonitor, PrometheusRule) - i.e. kube-prometheus-stack installed
# first. Off by default so the chart still installs on a bare cluster.
metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
  # Alerting rules. Thresholds are for the CPU laptop profile; a GPU pod would
  # tighten them (task 9).
  alerts:
    enabled: false
    p95Seconds: 4        # end-to-end p95 above this, sustained -> SwitchboardSlow
    queueDepth: 2        # requests waiting for the model, sustained -> SwitchboardBacklog
    errorRatio: 0.05     # share of requests failing -> SwitchboardErrors
    for: 1m
  # A Grafana dashboard, shipped as a ConfigMap the Grafana sidecar picks up.
  dashboard:
    enabled: false

# Task 7. Needs KEDA installed (and, for mode: http, the KEDA HTTP add-on).
autoscaling:
  enabled: false
  # prometheus - scale 1..N on requests in flight, read from Prometheus. Stable.
  # http       - scale 0..N through the HTTP add-on's interceptor, which holds
  #              requests while a pod cold-starts. The add-on is alpha.
  mode: prometheus
  minReplicas: 1
  maxReplicas: 4
  # One replica serves one request at a time (the model lock), so the target is
  # one request per replica: 4 concurrent requests want 4 replicas.
  targetInFlightPerReplica: 1
  pollingInterval: 15
  # How long demand must stay low before replicas are removed. Short here so
  # the proof finishes; production would keep the HPA default of 5 minutes.
  scaleDownWindowSeconds: 60
  prometheus:
    serverAddress: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
  http:
    host: switchboard.local
    # How long the interceptor holds a request while the first pod starts.
    coldStartWait: 120s

# Task 8. Needs Argo Rollouts installed. Mutually exclusive with autoscaling
# in this chart.
rollout:
  enabled: false
  # What happens to the original Deployment once the Rollout is healthy.
  deploymentScaleDown: onsuccess
  # Traffic share comes from pod counts (no mesh), so with 4 replicas the
  # first step is one canary pod beside four stable ones.
  steps:
    - setWeight: 25
    - pause: { duration: 90s }
    - setWeight: 50
    - pause: { duration: 60s }
  analysis:
    enabled: true
    prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
    # The canary's p95 model time may be at most this multiple of stable's.
    maxP95Ratio: 1.5
    interval: 30s
    # Give the canary a minute of traffic before judging it.
    initialDelay: 60s
    failureLimit: 1
# The image `helm test` runs. Only needs curl.
tests:
  image: curlimages/curl:8.11.1
